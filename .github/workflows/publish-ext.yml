name: Publish

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04

    environment:
      name: pypi-ext
      url: https://pypi.org/project/omigo-ext/

    permissions:
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          # Pinned, not '3.x': a float follows the newest CPython and strands
          # the lock on a version some dependency has no wheel for.
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --directory python-packages/extensions --locked

      - name: Build
        run: uv build python-packages/extensions

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python-packages/extensions/dist/
