name: Bandit
on:
  push:
    paths:
      - '**.py'
    branches: 
      - main
      - 'ver_*'
  pull_request:
    paths:
      - '**.py'
    branches: 
      - main
      - 'ver_*'

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        # This job requested a matrix variable that was never defined,
        # so no version was ever actually selected.
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install bandit
        # Install the package itself so pyproject is the single source of truth
        # for its dependencies.
        python -m pip install ./python-packages/core
    - name: Analyze core with bandit
      run: |
        bandit -r python-packages/core
    - name: Analyze extensions with bandit
      run: |
        bandit -r python-packages/extensions
    - name: Analyze hydra with bandit
      run: |
        bandit -r python-packages/hydra
    - name: Analyze lokki with bandit
      run: |
        bandit -r python-packages/lokki
    - name: Analyze arjun with bandit
      run: |
        bandit -r python-packages/arjun
    - name: Analyze matel with bandit
      run: |
        bandit -r python-packages/matel

