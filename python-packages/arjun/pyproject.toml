[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omigo-arjun"
version = "0.9.4"
description = "Data Analytics Library for Python"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "amit jaiswal", email = "amit.jaiswal@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "omigo_core",
    "omigo_ext",
    "omigo_hydra",
]

[project.urls]
Homepage = "https://github.com/CrowdStrike/omigo-data-analytics"
"Bug Tracker" = "https://github.com/CrowdStrike/omigo-data-analytics/browse"

[tool.hatch.build.targets.wheel]
packages = ["src/omigo_arjun"]
# Set explicitly rather than inherited: hatchling 1.32 changed its default
# to 2.5, which the publish action could not read. This keeps the metadata
# version stable across hatchling upgrades.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.uv]
constraint-dependencies = [
    "certifi>=2026.10.19",
    "Pillow>=13.0.0",
    "urllib3>=2.7.0",
    "cryptography>=50.0.0",
    "kafka-python>=2.3.2",
    "tornado>=6.5.8",
    "protobuf>=5.29.6",
    "fonttools>=4.60.2",
    "pyasn1>=0.6.4",
    "httplib2>=0.32.0",
    "vcrpy>=8.2.1",
    "idna>=3.15",
    "pytest>=9.0.3",
    "requests>=2.33.0",
    "Pygments>=2.20.0",
]
